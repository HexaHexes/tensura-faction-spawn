# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The race system this addon reads is provided by ManasCore (via Tensura).
[[dependencies.${mod_id}]]
modId = "tensura"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"


# The boundary contract the engine implements (spec section 3.2).
[[dependencies.${mod_id}]]
modId = "capital_api"
type = "required"
versionRange = "[1.0.0-alpha.1,)"
ordering = "BEFORE"
side = "BOTH"
# The capital-waypoint feature (spike #38): optional - everything degrades to
# a no-op when either mod is absent. Versions pinned per the spike's evidence.
[[dependencies.${mod_id}]]
modId = "xaerominimap"
type = "optional"
versionRange = "[26.6,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "xaeroworldmap"
type = "optional"
versionRange = "[1.47,)"
ordering = "NONE"
side = "CLIENT"