plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'checkstyle'
}

version = mod_version
group = mod_group_id

base {
    // Keep in sync with rootProject.name in settings.gradle and mod_id in
    // gradle.properties. The shipped jar is <archivesName>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests live in their own source set: they compile against main, and are
// deliberately NOT part of sourceSets.main - so none of it is packaged into the
// released jar. Declared before neoForge because the mods block below joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
    // The unit tests exercise the payload wire format against the real codec
    // classes, so they join main's classpath like the gametest set does.
    test {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless test runner. NeoForge's patched server Main boots a
        // GameTestServer that runs every registered @GameTest and exits - no
        // window, no live instance. This is the only verification gate.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
        }

        // Regenerates src/generated/resources - the spawn rules and capital
        // structure tags (issue #34). Boots FML like every run, so the staged
        // dependency stack below is staged first.
        data {
            data()
            gameDirectory = project.layout.projectDirectory.dir('run')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // The gametest source set joins the mod for the dev runs so
            // @GameTestHolder is discovered from FML's scan data. It is still
            // not in the jar - the jar only packages sourceSets.main.
            sourceSet sourceSets.gametest
        }
    }
}

// Expand the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml at build time, so mod identity is edited in one place
// (gradle.properties) rather than duplicated in the toml.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
// The generated datapack is committed and packaged as part of the mod's
// resources: datagen owns data/** (issue #34) and the CI drift gate keeps
// the committed tree identical to what runData produces.
sourceSets.main.resources.srcDir 'src/generated/resources'
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- Dependencies -----------------------------------------------------------
//
// The engine is Tensura-free at compile time (spec §5.1): everything
// race-dependent resolves through capital-api, implemented by the race
// integration. The gametest runtime still stages the full pack stack.
repositories {
    // The published boundary contract (capital-api), consumed as a versioned
    // Maven artifact per spec §3.2 - never a source-tree dependency.
    maven {
        name = 'CapitalApiPackages'
        url = uri('https://maven.pkg.github.com/HexaHexes/capital-api')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
            password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    mavenCentral()
}

configurations {
    // Runtime closure for the gametest run: staged into run/mods below.
    gametestMods
}

dependencies {
    // The boundary contract (spec §3.2).
    implementation 'org.bitwisemadness.capitalapi:capital_api:1.0.0-alpha.1'

    // Xaero's Minimap: the waypoint feature's compile surface (optional at
    // runtime - every call degrades to a no-op when Xaero is absent).
    compileOnly "curse.maven:xaeros-minimap-263420:9067173" // xaerominimap 1.21.1-neoforge-26.6.0

    gametestMods 'curse.maven:architectury-419699:8492726'
    gametestMods 'curse.maven:geckolib-388172:8893490'
    gametestMods 'curse.maven:manascore-619025:8022425'
    gametestMods 'curse.maven:smartbrainlib-661293:7055149'
    gametestMods 'curse.maven:tensura-reincarnated-643695:8793360'
    gametestMods 'curse.maven:terrablender-940057:6054947'
    // The boundary contract - the spawn mod now requires it at runtime.
    gametestMods 'org.bitwisemadness.capitalapi:capital_api:1.0.0-alpha.1'
    // The full staged ecosystem boots in this runtime: the generation engine
    // and every capital jar, so the combined boot and the full capital-tag
    // surface are verified per PR, not discovered in the instance.
    gametestMods 'org.bitwisemadness.capitalcore:capital_core:1.0.0-alpha.04'
    gametestMods 'org.bitwisemadness.tensuracapitalmortals:tensura_capital_mortals:1.0.0-alpha.1'
    gametestMods 'org.bitwisemadness.tensuracapitalwilds:tensura_capital_wilds:1.0.0-alpha.1'
    gametestMods 'org.bitwisemadness.tensuracapitalgiants:tensura_capital_giants:1.0.0-alpha.1'
    gametestMods 'org.bitwisemadness.tensuracapitalcelestials:tensura_capital_celestials:1.0.0-alpha.1'
    gametestMods 'org.bitwisemadness.tensuracapitalhell:tensura_capital_hell:1.0.0-alpha.1'
    gametestMods 'org.bitwisemadness.tensuracapitalbeastfolk:tensura_capital_beastfolk:1.0.0-alpha.1'
    gametestMods 'org.bitwisemadness.tensuracapitalinsect:tensura_capital_insect:1.0.0-alpha.1'
    gametestMods 'org.bitwisemadness.tensuracapitalmonsters:tensura_capital_monsters:1.0.0-alpha.1'
    // The race integration joins the gametest runtime so the boundary test
    // proves the cross-jar registration (both sides of capital-api present).
    gametestMods 'org.bitwisemadness.capitaltensurareincarnated:capital_tensura_reincarnated:1.0.0-alpha.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The pure parsing/selection logic is deliberately Minecraft-free but uses
    // Gson, so the JUnit suite stays a plain-JVM run.
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
}

// --- GameTest harness -------------------------------------------------------

// Stage the pack's dependency mod jars into the run's production-style mods/
// folder, where FML's mods-folder locator finds them exactly like in the pack.
tasks.register('prepareGametestMods', Sync) {
    from configurations.gametestMods
    into 'run/mods'
}

// Both the GameTest run and the data run boot FML against the run/ directory,
// so both need the dependency stack staged first (the data run constructs the
// mod, which registers the capital-api engine).
tasks.matching { it.name == 'runGameTestServer' || it.name == 'runData' }.configureEach {
    dependsOn 'prepareGametestMods'
}

// Grade the GameTest run on the log summary, not the exit code: the
// GameTestServer prints "All N required tests passed :)" when every required
// test succeeds. Keep expectedTests in sync with the @GameTest methods in
// src/gametest.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    def expectedTests = 7
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// Every repo in the org publishes its artifact to the org's GitHub Packages
// Maven registry for alpha, beta and stable releases (see agents/AGENTS.md):
// release.yml cuts the GitHub release, publish.yml runs on "release published"
// and drives this block. Credentials come from the workflow token in CI; a
// local publish can supply gpr.user / gpr.key in ~/.gradle/gradle.properties.
// Keep the URL pointing at THIS repository - the rename checklist covers it.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/tensura-faction-spawn')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (report-only grace period) ----------------------------
// Both tools run as the `static` CI job. During the grace period neither can
// block a build: SpotBugs findings are recorded but never fail the task, and
// Spotless is detached from `check` (enforceCheck false) so the junit job's
// `./gradlew build` stays style-agnostic. Gating flips on in a follow-up once
// the finding volume is known; that follow-up also runs one spotlessApply per
// repo to clear the baseline.
spotbugs {
    ignoreFailures = true
    effort = com.github.spotbugs.snom.Effort.MAX
}
checkstyle {
    toolVersion = '14.4.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = Integer.MAX_VALUE
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    // HTML report into build/reports/spotbugs for the CI artifact upload.
    reports {
        html.required = true
        xml.required = false
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        // Trailing whitespace, final newline, deterministic import order.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
